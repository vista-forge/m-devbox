# m-cli configuration for the examples/hello starter project.
#
# Modern (pythonic-lower) M — the style a new devbox project should follow,
# checked by `m lint`. The formatter has no lowercasing preset yet, so `fmt`
# is pinned to identity (m-cli T0-3 made unknown presets a hard error); switch
# when a modern preset ships. Mirrors m-stdlib/.m-cli.toml.

[lint]
rules = "modern"
target_engine = "any"

[fmt]
rules = "identity"

[lsp]
"hover.format" = "markdown"

# Dependency routines for STAGED runs (R13/M10). On YottaDB these modules are
# ALSO resident in /opt/lib/r (ambient), so pre-R13 runs never needed this;
# a staged run — every RSM run, since a scratch UCI sees only its own
# routines plus %* — loads its dependencies from this source tree instead.
[dependencies]
routines = ["/opt/msl/src", "src"]
